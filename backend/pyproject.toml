[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvenom"
version = "0.1.0"
description = "CVEnom vulnerability threat radar backend"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2.10",
    "celery>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "pydantic>=2.10",
    "email-validator>=2.2",
    "pydantic-settings>=2.7",
    "bleach>=6.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "aiosmtplib>=3.0",
    "maxminddb>=2.6",
    "feedparser>=6.0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "mmdb-writer>=0.2.7",
    "fakeredis[lua]>=2.26",
    "watchfiles>=1.0",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: lint only, `ruff format` is not adopted; long lines are left to review.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: `x = Depends(...)` defaults are evaluated by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]
