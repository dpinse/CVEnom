# CVEnom frontend: unprivileged nginx. Installed as /etc/nginx/conf.d/default.conf, so the
# directives before `server {` are in the http context of the image's stock nginx.conf.
#
# Proxy-trust chain (see docs/deploy.md):
#   cloudflared (host) -> bridge gateway 172.28.0.1 -> this nginx (172.28.0.10) -> api:8000
# Cloudflare/cloudflared appends the visitor to X-Forwarded-For; the gateway is the TCP peer here.
# Only the gateway is trusted below; anything else that could reach this port is treated as the
# client itself.

# Coarse per-client backstop. The app has its own, stricter rate limits: this only blunts floods
# before they reach Python, so it is deliberately generous.
limit_req_zone $binary_remote_addr zone=perclient:10m rate=20r/s;
limit_req_status 429;

# X-Forwarded-Proto handed to the api: the immediate peer's value is passed through ONLY when that
# peer is the trusted gateway (keep in sync with set_real_ip_from) AND the value is exactly http or
# https (behind cloudflared the TCP hop is plain http, so $scheme alone would always say http).
# Anything else, including any client-supplied value, falls back to $scheme.
map "$realip_remote_addr:$http_x_forwarded_proto" $xfp_to_api {
  default                 $scheme;
  "172.28.0.1:http"       http;
  "172.28.0.1:https"      https;
}

# Cache policy, decided in ONE place so no location needs its own add_header (nginx drops every
# inherited add_header in a location that declares one, which would silently strip the security
# headers). An empty value means "send no header": /api/ responses keep the API's own policy.
map "$status:$uri" $cache_control {
  default                        "no-store";
  ~^(200|304):/assets/           "public, max-age=31536000, immutable";
  ~^[0-9]+:/api/                 "";
}

# X-Forwarded-For handed to the api: the incoming chain plus the TCP peer (the gateway). Written
# out explicitly because real_ip below rewrites $remote_addr (and so $proxy_add_x_forwarded_for)
# to the visitor, which would drop the gateway hop from the chain the api walks.
map $http_x_forwarded_for $xff_to_api {
  ""      $realip_remote_addr;
  default "$http_x_forwarded_for, $realip_remote_addr";
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  # The visitor is whatever the gateway's X-Forwarded-For says: used for limit_req only.
  set_real_ip_from 172.28.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  root /usr/share/nginx/html;
  index index.html;

  # Request limits.
  client_max_body_size 64k;
  client_body_buffer_size 16k;
  client_header_buffer_size 2k;
  large_client_header_buffers 4 8k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 30s;

  # Security headers, on every response including errors (`always`). Declared ONLY here: no
  # location below may add its own add_header (see the cache map above).
  # CSP: every source is 'self'. connect-src 'self' also covers same-origin ws/wss in current
  # Chromium and Firefox (verified by e2e/csp.spec.ts). No blob:, no unsafe-*, no remote origin.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cache-Control $cache_control always;

  # Re-resolve `api` through Docker's DNS so an api container that is recreated (new IP) keeps
  # working without restarting nginx. Using a variable in proxy_pass is what makes this happen.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:8000;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /assets/ {
    # Hashed filenames: a missing one is a 404, never the SPA shell.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    try_files $uri =404;
  }

  # WebSocket first: an exact match wins over the /api/ prefix.
  location = /api/ws/live {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $xff_to_api;
    proxy_set_header X-Forwarded-Proto $xfp_to_api;
    proxy_set_header CF-Connecting-IP "";
    limit_req zone=perclient burst=40 nodelay;
    # The api sets its own copies of these five; nginx sends them (identically or stricter) once.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    # longer than the server's 20 s ping interval and 30 s ping timeout
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $xff_to_api;
    proxy_set_header X-Forwarded-Proto $xfp_to_api;
    # Rate limit the API only: static files are cheap, and one NAT'd office must be able to load the SPA.
    limit_req zone=perclient burst=40 nodelay;
    # The api sets its own copies of these five; nginx sends them (identically or stricter) once.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    # A client-supplied CF-Connecting-IP is never forwarded. The app's TRUST_CF_CONNECTING_IP
    # must stay false behind this nginx (it is the default).
    proxy_set_header CF-Connecting-IP "";
    proxy_connect_timeout 5s;
    # Longer than the slowest endpoint: POST /api/alerts/rules/{id}/test may take up to
    # TEST_SEND_TIMEOUT_S (45 s) in the backend.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location / {
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    try_files $uri /index.html;
  }
}
