<title>CVEnom Radar v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky command bar → page. Dashboard = today line, map + country panel, four short lanes, daily volume.
   Threats = filter bar + one dense table. Threat page = status line, metrics, evidence ladder, timeline, versions. */
:root {
  --bg: #0a0e15; --panel: #0d131c; --panel-2: #141d2a; --line: #1c2735; --line-2: #263445;
  --text: #e9eef4; --muted: #8a97a7; --faint: #7d8a9b;
  --sev-crit: #ff5663; --sev-high: #ff9a44; --sev-med: #ecc14a; --sev-low: #3dd79a;
  --live: #ff2f45; --scope: #6fb0d4;
  --ocean: #070b11; --land: #142131; --border-geo: #35506c; --dot: #ff4458;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 6px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #e9eef4; --panel: #ffffff; --panel-2: #eef3f9; --line: #d2dde9; --line-2: #bccbdb;
  --text: #0f1a27; --muted: #52637a; --faint: #5c6c80;
  --sev-crit: #c8202f; --sev-high: #a15208; --sev-med: #7f6200; --sev-low: #077a53;
  --live: #c00f24; --scope: #19729f;
  --ocean: #dce7f1; --land: #f6f9fc; --border-geo: #8fb0ca; --dot: #d0182c;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #e9eef4; --panel: #ffffff; --panel-2: #eef3f9; --line: #d2dde9; --line-2: #bccbdb;
  --text: #0f1a27; --muted: #52637a; --faint: #5c6c80;
  --sev-crit: #c8202f; --sev-high: #a15208; --sev-med: #7f6200; --sev-low: #077a53;
  --live: #c00f24; --scope: #19729f;
  --ocean: #dce7f1; --land: #f6f9fc; --border-geo: #8fb0ca; --dot: #d0182c;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font-body); }
::selection { background: color-mix(in srgb, var(--scope) 40%, transparent); }
a { color: var(--scope); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--scope); outline-offset: 2px; border-radius: 3px; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.mock-note { background: var(--panel-2); color: var(--muted); font-size: 12px; text-align: center; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar-in, .page { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { display: flex; align-items: center; gap: 20px; min-height: 52px; flex-wrap: wrap; padding-block: 6px; }
.brand { font: 700 18px/1 var(--font-display); letter-spacing: .02em; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); }
.brand svg { color: var(--live); }
nav.main { display: flex; gap: 2px; }
nav.main a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: var(--radius); font-weight: 500; }
nav.main a:hover { color: var(--text); background: var(--panel-2); }
nav.main a[aria-current="page"] { color: var(--text); background: var(--panel-2); box-shadow: inset 0 -2px 0 var(--scope); }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; }
.seg button { background: none; border: 0; padding: 5px 11px; cursor: pointer; color: var(--muted); font: 500 12.5px var(--font-mono); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button:hover { color: var(--text); background: var(--panel-2); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.live-dot { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.live-dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--sev-low); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sev-low) 25%, transparent); }
.who { width: 30px; height: 30px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line-2); display: grid; place-items: center; font: 600 12px var(--font-body); color: var(--muted); }

.page { padding-block: 20px 56px; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; line-height: 1.15; }
h2 { font-size: 17px; }
.muted { color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

/* Today line */
.today { display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: baseline; }
.today h1 { font-size: 22px; margin-right: 6px; }
.today a { color: var(--text); text-decoration: none; display: inline-flex; gap: 7px; align-items: baseline; }
.today a b { font: 600 18px var(--font-mono); font-variant-numeric: tabular-nums; }
.today a b.hot { color: var(--live); }
.today a span { color: var(--muted); border-bottom: 1px dotted var(--line-2); }
.today a:hover span { color: var(--text); border-color: var(--text); }

/* Map */
.mapgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
.map-stage { position: relative; background: var(--ocean); border-right: 1px solid var(--line); min-height: 300px; border-radius: var(--radius) 0 0 var(--radius); overflow: hidden; }
.map-stage svg { display: block; width: 100%; height: auto; cursor: default; }
.map-stage.globe svg { cursor: grab; }
.map-tools { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; }
.map-tools .seg { background: var(--panel); }
.map-legend { position: absolute; left: 12px; bottom: 10px; display: flex; gap: 14px; align-items: center; font-size: 11.5px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 5px 9px; border-radius: var(--radius); border: 1px solid var(--line); }
.map-legend .steps { display: inline-flex; gap: 2px; }
.map-legend .steps i { width: 18px; height: 9px; border-radius: 2px; border: 1px solid var(--border-geo); }
.country { fill: var(--land); stroke: var(--border-geo); stroke-width: .5; transition: fill .15s; }
.country.has { cursor: pointer; }
.country.has:hover, .country.sel { stroke: var(--text); stroke-width: 1.2; }
.country.sel { fill: color-mix(in srgb, var(--scope) 30%, var(--land)); }
.sphere { fill: var(--ocean); stroke: var(--line-2); }
.grat { fill: none; stroke: var(--line); stroke-width: .4; }
.dot { fill: var(--dot); fill-opacity: .85; stroke: var(--ocean); stroke-width: 1; cursor: pointer; }
.dot:hover, .dot.sel { fill-opacity: 1; stroke: var(--text); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 6px 9px; font-size: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.35); white-space: nowrap; }
.side { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.clist { list-style: none; margin: 0; padding: 0; display: grid; }
.clist button { width: 100%; background: none; border: 0; display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 6px 4px; border-radius: 4px; cursor: pointer; text-align: left; }
.clist button:hover { background: var(--panel-2); }
.clist .cc { font: 500 11px var(--font-mono); color: var(--muted); }
.clist .nm { display: block; min-width: 0; }
.clist .bar-mini { display: block; height: 4px; background: var(--line); border-radius: 2px; margin-top: 3px; }
.clist .bar-mini i { display: block; height: 100%; background: var(--dot); border-radius: 2px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--font-mono); text-align: right; }
.back { background: none; border: 0; color: var(--scope); cursor: pointer; padding: 0; font-size: 12.5px; }

/* Lanes */
.lanes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.lane { display: flex; flex-direction: column; min-width: 0; }
.lane-head { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 8px; }
.lane-head h2 { font-size: 15px; }
.lane-head .n { margin-left: auto; font: 500 12px var(--font-mono); color: var(--muted); }
.lane-head .tick { width: 8px; height: 8px; border-radius: 2px; align-self: center; }
.lane[data-k="exploited"] .tick { background: var(--live); }
.lane[data-k="likely"] .tick { background: var(--sev-high); }
.lane[data-k="loud"] .tick { background: var(--scope); }
.lane[data-k="fresh"] .tick { background: var(--sev-med); }
.lane-sub { padding: 0 14px 8px; font-size: 12px; color: var(--faint); border-bottom: 1px solid var(--line); }
.lane-items { display: grid; }
.row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 3px 10px; padding: 9px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; }
.row:hover { background: var(--panel-2); }
.row .sev { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; grid-row: span 2; }
.row .id { font: 500 12.5px var(--font-mono); }
.row .score { font: 500 12px var(--font-mono); text-align: right; }
.row .t { grid-column: 2 / 4; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { grid-column: 2 / 4; display: flex; gap: 10px; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; }
.row .meta .k { color: var(--live); font-weight: 600; }
.s-crit { background: var(--sev-crit); } .s-high { background: var(--sev-high); } .s-med { background: var(--sev-med); } .s-low { background: var(--sev-low); }
.c-crit { color: var(--sev-crit); } .c-high { color: var(--sev-high); } .c-med { color: var(--sev-med); } .c-low { color: var(--sev-low); }
.lane-foot { margin-top: auto; padding: 9px 14px; font-size: 12.5px; }
.lane-foot a { text-decoration: none; }
.lane-foot a:hover { text-decoration: underline; }
.lane-empty { padding: 16px 14px; color: var(--muted); font-size: 13px; }

/* Volume chart */
.vol { padding: 14px 16px; display: grid; gap: 8px; }
.vol-head { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.vol-head .leg { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); margin-left: auto; }
.vol-head .leg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.vol svg { width: 100%; height: 110px; display: block; }
.vol text { fill: var(--faint); font: 10px var(--font-mono); }

/* Threats page */
.th-head { display: flex; gap: 16px; align-items: end; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--text); border-color: var(--scope); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters input[type=search] { background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 7px 10px; color: var(--text); min-width: 0; width: 260px; max-width: 100%; }
.chip-btn { background: var(--panel); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.chip-btn[aria-pressed="true"] { color: var(--text); border-color: var(--text); background: var(--panel-2); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 600 11.5px var(--font-body); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; }
th button[data-dir]::after { content: attr(data-dir); margin-left: 4px; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--panel-2); }
td .t { display: block; max-width: 520px; }
td .sub { display: block; color: var(--faint); font-size: 12px; }
.tag { display: inline-block; font: 500 11px var(--font-mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--muted); margin: 0 4px 3px 0; white-space: nowrap; }
.tag.kev { color: var(--live); border-color: color-mix(in srgb, var(--live) 50%, transparent); }
.tag.poc { color: var(--sev-high); border-color: color-mix(in srgb, var(--sev-high) 50%, transparent); }
.sel { background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 6px 8px; color: var(--text); font: inherit; font-size: 13px; }
.sevchips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.sev-chip { --c: var(--sev-low); display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 11px 4px 9px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.sev-chip[data-sev="med"] { --c: var(--sev-med); } .sev-chip[data-sev="high"] { --c: var(--sev-high); } .sev-chip[data-sev="crit"] { --c: var(--sev-crit); }
.sev-chip i { width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 2px solid var(--c); }
.sev-chip:hover { border-color: var(--c); color: var(--text); }
.sev-chip[aria-pressed="true"] { color: var(--text); font-weight: 600; border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--panel)); }
.sev-chip[aria-pressed="true"] i { background: var(--c); }
.sortbox { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
.sort-desc { font-size: 12px; color: var(--faint); }
.morefilters { display: inline-flex; gap: 8px; }
.skip { position: absolute; left: -9999px; } .skip:focus { position: static; }
.pager { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; gap: 12px; flex-wrap: wrap; }
.pager .pg { display: inline-flex; gap: 10px; align-items: center; }
.sevpill { display: inline-flex; align-items: center; gap: 6px; font: 500 12.5px var(--font-mono); white-space: nowrap; }
.sevpill i { width: 8px; height: 8px; border-radius: 50%; }

/* Threat page */
.crumb { font-size: 12.5px; color: var(--muted); }
.crumb a { color: var(--muted); }
.t-head { display: grid; gap: 8px; }
.t-head .idline { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font: 500 14px var(--font-mono); color: var(--muted); }
.status { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 12px 16px; font-size: 13px; align-items: center; }
.status b { font-weight: 600; }
.status .on { color: var(--live); }
.status .ok { color: var(--sev-low); }
.status .asof { margin-left: auto; color: var(--faint); font-size: 12px; }
.t-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.t-main { display: grid; gap: 20px; min-width: 0; }
.t-aside { display: grid; gap: 14px; position: sticky; top: 72px; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.metric { padding: 14px 16px; border-right: 1px solid var(--line); display: grid; gap: 2px; align-content: start; }
.metric:last-child { border-right: 0; }
.metric .lbl { font-size: 12px; color: var(--muted); }
.metric .val { font: 600 22px var(--font-mono); font-variant-numeric: tabular-nums; }
.metric .note { font-size: 12px; color: var(--faint); }
section.blk { display: grid; gap: 10px; }
section.blk > h2 { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.ladder { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; }
.ladder li { padding: 12px 12px 12px 0; display: grid; gap: 4px; align-content: start; position: relative; }
.ladder li::before { content: ""; height: 3px; border-radius: 2px; background: var(--line-2); display: block; margin-bottom: 6px; }
.ladder li.done::before { background: var(--live); }
.ladder li.done.soft::before { background: var(--sev-high); }
.ladder .st { font-weight: 600; font-size: 13px; }
.ladder li:not(.done) .st { color: var(--faint); }
.ladder .ev { font-size: 12px; color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl li { display: grid; grid-template-columns: 92px 70px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; align-items: baseline; }
.tl .d { font-family: var(--font-mono); color: var(--muted); font-size: 12px; }
.tl .off { font-family: var(--font-mono); color: var(--faint); font-size: 12px; }
.tl .src { color: var(--faint); font-size: 12px; }
.tl li.key .e { font-weight: 600; }
.vers td { cursor: default; }
.vers tbody tr:hover td { background: none; }
.prose { max-width: 72ch; color: var(--text); overflow-wrap: anywhere; }
.prose p { margin: 0 0 10px; }
.action { padding: 12px 16px; border: 1px solid color-mix(in srgb, var(--live) 40%, var(--line)); background: color-mix(in srgb, var(--live) 7%, var(--panel)); border-radius: var(--radius); display: grid; gap: 4px; }
.action .who2 { font-size: 12px; color: var(--muted); }
.cvss-v { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 14px; font-size: 12.5px; }
.cvss-v div { display: grid; } .cvss-v span { color: var(--muted); font-size: 11.5px; } .cvss-v b { font-weight: 500; }
.reflist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.reflist li { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.reflist a { overflow-wrap: anywhere; }
.reflist .k { font: 500 11px var(--font-mono); color: var(--faint); min-width: 64px; }
.aside-box { padding: 14px 16px; display: grid; gap: 8px; }
.aside-box h3 { font-size: 14px; }
.story { display: grid; gap: 1px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.story:last-child { border-bottom: 0; }
.story span { color: var(--faint); font-size: 12px; }

/* Drawer (quick view) */
.scrim { position: fixed; inset: 0; background: rgba(3,6,10,.5); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel); border-left: 1px solid var(--line-2); z-index: 21;
  display: flex; flex-direction: column; box-shadow: -12px 0 32px rgba(0,0,0,.35); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer-head { display: flex; gap: 10px; align-items: start; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.drawer-head .x { margin-left: auto; background: none; border: 1px solid var(--line-2); border-radius: var(--radius); width: 30px; height: 30px; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.drawer-body { padding: 14px 18px 20px; overflow-y: auto; display: grid; gap: 14px; align-content: start; min-width: 0; }
.drawer-body .prose { font-size: 13.5px; }
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--text); color: var(--bg); border: 0; border-radius: var(--radius); padding: 8px 14px; font-weight: 600; cursor: pointer; text-decoration: none; justify-self: start; }
.btn:hover { opacity: .9; }

@media (max-width: 1100px) {
  .lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .t-grid { grid-template-columns: minmax(0, 1fr); }
  .t-aside { position: static; }
}
@media (max-width: 820px) {
  .mapgrid { grid-template-columns: minmax(0, 1fr); }
  .map-stage { border-right: 0; border-bottom: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metric:nth-child(2) { border-right: 0; } .metric:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .ladder { grid-template-columns: minmax(0, 1fr); }
  .cvss-v { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .live-dot { display: none; }

// Map: flat (Mercator, what MapLibre ships) or globe; outlines + one dot per country.
let globeRot = [-10, -25];
const STEPS = [16, 32, 50, 70, 90]; // % of the alert colour mixed into the land colour, per bucket
function geoTotals() {
  const f = S.range / 7;
  const out = {};
  for (const [cc, v] of Object.entries(GEO)) out[cc] = v.map((x) => Math.round(x * f * (cc === "US" || cc === "CN" ? 1 : 0.95))).reduce((a, b) => a + b, 0) || 1;
  return out;
}
function drawMap() {
  const stage = document.getElementById("stage");
  stage.classList.toggle("globe", S.mapMode === "globe");
  stage.querySelectorAll("svg, .tip").forEach((n) => n.remove());
  const W = 960, H = S.mapMode === "flat" ? 470 : 520;
  const svg = d3.select(stage).insert("svg", ":first-child").attr("viewBox", `0 0 ${W} ${H}`).attr("role", "img").attr("aria-label", "Map of threat activity by country");
  const tip = d3.select(stage).append("div").attr("class", "tip").attr("hidden", true);
  const land = topojson.feature(WORLD, WORLD.objects.countries).features.filter((f) => f.properties.name !== "Antarctica");
  const byNum = {}; for (const [cc, n] of Object.entries(ISO_N)) byNum[String(n).padStart(3, "0")] = cc;
  const totals = geoTotals();
  const max = Math.max(...Object.values(totals));
  const rS = d3.scaleSqrt().domain([0, max]).range([2, 11]);
  const proj = S.mapMode === "flat"
    ? d3.geoMercator().rotate([-10, 0]).fitExtent([[10, 10], [W - 10, H - 10]], { type: "FeatureCollection", features: land })
    : d3.geoOrthographic().fitExtent([[20, 20], [W - 20, H - 20]], { type: "Sphere" }).rotate(globeRot).clipAngle(90);
  const path = d3.geoPath(proj);
  const g = svg.append("g");
  if (S.mapMode === "globe") {
    g.append("path").attr("class", "sphere").attr("d", path({ type: "Sphere" }));
    g.append("path").attr("class", "grat").attr("d", path(d3.geoGraticule10()));
  }
  // Anchor = centroid of each country's largest polygon (keeps France's dot in France, not the Atlantic).
  const anchor = (f) => {
    if (f.geometry.type !== "MultiPolygon") return d3.geoCentroid(f);
    let best = null, area = -1;
    for (const p of f.geometry.coordinates) { const ff = { type: "Polygon", coordinates: p }; const a = d3.geoArea(ff); if (a > area) { area = a; best = ff; } }
    return d3.geoCentroid(best);
  };
  const countries = g.selectAll("path.country").data(land).join("path")
    .attr("class", (f) => "country" + (totals[byNum[f.id]] ? " has" : "") + (S.country === byNum[f.id] ? " sel" : ""))
    .attr("d", path)
    .style("fill", (f) => { const n = totals[byNum[f.id]]; if (!n) return null; const b = Math.min(4, Math.floor(Math.sqrt(n / max) * 5)); return `color-mix(in srgb, var(--dot) ${STEPS[b]}%, var(--land))`; });
  const dots = land.filter((f) => totals[byNum[f.id]]).map((f) => ({ cc: byNum[f.id], ll: anchor(f), n: totals[byNum[f.id]] })).sort((a, b) => b.n - a.n);
  const dotSel = g.selectAll("circle.dot").data([]).join("circle").attr("class", (d) => "dot" + (S.country === d.cc ? " sel" : "")).attr("r", (d) => rS(d.n));
  const place = () => {
    countries.attr("d", path);
    g.selectAll(".sphere").attr("d", path({ type: "Sphere" }));
    g.selectAll(".grat").attr("d", path(d3.geoGraticule10()));
    dotSel.each(function (d) {
      const vis = S.mapMode === "flat" || d3.geoDistance(d.ll, [-proj.rotate()[0], -proj.rotate()[1]]) < Math.PI / 2 - .05;
      const [x, y] = proj(d.ll);
      d3.select(this).attr("cx", x).attr("cy", y).attr("display", vis ? null : "none");
    });
  };
  place();
  const show = (ev, cc) => {
    if (!cc || !totals[cc]) { tip.attr("hidden", true); return; }
    const r = stage.getBoundingClientRect();
    tip.attr("hidden", null).html(`<b>${NAMES[cc]}</b> · <span class="num">${totals[cc]}</span> events`)
      .style("left", Math.min(ev.clientX - r.left + 12, r.width - 170) + "px").style("top", (ev.clientY - r.top + 12) + "px");
  };
  countries.on("mousemove", (ev, f) => show(ev, byNum[f.id])).on("mouseleave", () => tip.attr("hidden", true))
    .on("click", (ev, f) => { if (totals[byNum[f.id]]) selectCountry(byNum[f.id]); });
  dotSel.on("mousemove", (ev, d) => show(ev, d.cc)).on("mouseleave", () => tip.attr("hidden", true)).on("click", (ev, d) => selectCountry(d.cc));
  if (S.mapMode === "globe") {
    svg.call(d3.drag().on("drag", (ev) => {
      const r = proj.rotate(); globeRot = [r[0] + ev.dx * .3, Math.max(-60, Math.min(60, r[1] - ev.dy * .3))];
      proj.rotate(globeRot); place();
    }));
  }
}

function drawVol() {
  const el = document.getElementById("vol");
  const R = S.range, n = R === 1 ? 24 : R, unit = R === 1 ? "hour" : "day";
  let seed = 7 + R; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const data = d3.range(n).map(() => { const k = R === 1 ? .12 : 1; return { crit: Math.round((3 + rnd() * 9) * k), high: Math.round((15 + rnd() * 30) * k), med: Math.round((20 + rnd() * 40) * k), low: Math.round((4 + rnd() * 10) * k) }; });
  const total = d3.sum(data, (d) => d.crit + d.high + d.med + d.low);
  el.innerHTML = `<div class="vol-head"><h2>New CVEs per ${unit}</h2><span class="muted num">${total.toLocaleString()} in the last ${rangeLabel()}</span>
    <span class="leg"><span><i class="s-crit"></i>Critical</span><span><i class="s-high"></i>High</span><span><i class="s-med"></i>Medium</span><span><i class="s-low"></i>Low</span></span></div>`;
  const W = 1000, H = 110, pad = 18;
  const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("preserveAspectRatio", "none").attr("aria-label", `New CVEs per ${unit}, stacked by severity`);
  const x = d3.scaleBand().domain(d3.range(n)).range([0, W]).padding(n < 15 ? .55 : .2);
  const y = d3.scaleLinear().domain([0, d3.max(data, (d) => d.crit + d.high + d.med + d.low)]).range([H - pad, 4]);
  const st = d3.stack().keys(["crit", "high", "med", "low"])(data);
  const col = { crit: "var(--sev-crit)", high: "var(--sev-high)", med: "var(--sev-med)", low: "var(--sev-low)" };
  svg.selectAll("g").data(st).join("g").attr("fill", (s) => col[s.key]).attr("fill-opacity", .85)
    .selectAll("rect").data((s) => s).join("rect").attr("x", (d, i) => x(i)).attr("width", x.bandwidth()).attr("y", (d) => y(d[1])).attr("height", (d) => Math.max(0, y(d[0]) - y(d[1])));
  svg.append("text").attr("x", 0).attr("y", H - 3).text(R === 1 ? "24h ago" : fmt(ago(R - 1)));
  svg.append("text").attr("x", W).attr("y", H - 3).attr("text-anchor", "end").text("now");
}

  document.getElementById("q").addEventListener("input", (e) => { S.q = e.target.value; fill(); });
  document.getElementById("added").addEventListener("change", (e) => { S.added = e.target.value; fill(); });
  document.getElementById("sortsel").addEventListener("change", (e) => { S.sortT = e.target.value; fill(); });
  document.getElementById("morebtn").addEventListener("click", (e) => { S.more = !S.more; e.currentTarget.setAttribute("aria-expanded", String(S.more)); document.getElementById("more").hidden = !S.more; });
  tab.querySelectorAll("[data-status]").forEach((b) => b.addEventListener("click", () => { S.status = b.dataset.status; tab.querySelectorAll("[data-status]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); fill(); }));
  tab.querySelectorAll("[data-sev]").forEach((b) => b.addEventListener("click", () => { const k = b.dataset.sev; S.sevs.has(k) ? S.sevs.delete(k) : S.sevs.add(k); b.setAttribute("aria-pressed", String(S.sevs.has(k))); fill(); }));
  tab.querySelectorAll("[data-t]").forEach((b) => b.addEventListener("click", () => { S[b.dataset.t] = !S[b.dataset.t]; b.setAttribute("aria-pressed", String(S[b.dataset.t])); fill(); }));
}
function renderNewsTab() {
  const rows = STORIES.filter((s) => s.age <= S.range).sort((a, b) => a.age - b.age);
  document.getElementById("tab").innerHTML = `<div class="panel tbl-wrap"><table><thead><tr><th>Story</th><th>Source</th><th>CVEs</th><th>Published</th></tr></thead><tbody>
    ${rows.map((s) => `<tr><td><span class="t">${esc(s.title)}</span></td><td class="muted" style="white-space:nowrap">${esc(s.src)}</td><td>${s.cves.map((id) => `<a class="tag" href="#cve-${id.toLowerCase()}">${id}</a>`).join("") || `<span class="muted">none</span>`}</td><td class="num muted">${relD(s.age)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

// ---- Threat page ----
function detailFor(c) {
  const pub = ago(c.pubAge), kevD = c.kev ? ago(c.kevAge) : null;
  const ev = [
    { d: ago(c.pubAge + 9), e: "CVE ID reserved", src: "CVE.org" },
    { d: ago(c.pubAge + .3), e: "Vendor advisory and fixed releases", src: c.product.split(" ")[0] + " advisory", key: true },
    { d: pub, e: "Published to NVD", src: "NVD", key: true, t0: true },
    { d: ago(c.pubAge - .2), e: `CVSS ${c.cvss} assigned`, src: "NVD" },
  ];
  if (c.poc) ev.push({ d: ago(Math.max(c.pubAge - 1.5, (c.kevAge || 0) + .4)), e: "Public exploit released", src: "Exploit-DB", key: true });
  if (c.news) ev.push({ d: ago(c.newsAge + .6), e: "First news coverage", src: STORIES.find((s) => s.cves.includes(c.id))?.src || "BleepingComputer" });
  if (c.kev) ev.push({ d: kevD, e: "Added to CISA KEV, exploited in the wild", src: "CISA", key: true });
  ev.push({ d: ago(Math.max(.1, (c.kevAge || c.pubAge) - .5)), e: `EPSS rose to p${Math.round(c.epss * 100)}`, src: "FIRST EPSS" });
  ev.sort((a, b) => a.d - b.d);
  return { pub, kevD, ev };
}
function renderThreat(id) {
  const c = CVES.find((x) => x.id === id) || CVES[0];
  const s = sev(c.cvss), { pub, kevD, ev } = detailFor(c);
  const due = kevD ? new Date(+kevD + 21 * DAY) : null;
  const ladder = [
    { st: "Disclosed", done: true, ev: fmt(pub) + " · NVD" },
    { st: "Detectable", done: true, soft: true, ev: "Nuclei template" },
    { st: "Public exploit", done: c.poc, soft: true, ev: c.poc ? "Exploit-DB, GitHub" : "None found" },
    { st: "Exploited in the wild", done: c.kev, ev: c.kev ? "CISA KEV · " + fmt(kevD) : "No reports" },
    { st: "Ransomware use", done: !!c.ransomware, ev: c.ransomware ? "KEV: known" : "Not known" },
  ];
  const t0 = +pub;
  const off = (d) => { const h = (d - t0) / 36e5; return h === 0 ? "t = 0" : (h < 0 ? "−" : "+") + (Math.abs(h) < 48 ? Math.round(Math.abs(h)) + "h" : Math.round(Math.abs(h) / 24) + "d"); };
  const ivanti = c.id === "CVE-2026-109619" || c.id === "CVE-2026-109618";
  const vers = ivanti
    ? [["Ivanti Connect Secure", "22.7R2 through 22.7R2.5", "22.7R2.6", "NVD CPE"], ["Ivanti Connect Secure", "9.1R18 and earlier (end of life)", "No fix. Migrate.", "NVD CPE"], ["Ivanti Policy Secure", "22.7R1 through 22.7R1.3", "22.7R1.4", "NVD CPE"], ["Ivanti ZTA Gateways", "22.8R2 and earlier", "22.8R2.2", "Vendor advisory"]]
    : [[c.product, "all releases before the fixed version", c.patch === false ? "No fix yet" : "see advisory", "NVD CPE"]];
  const stories = STORIES.filter((x) => x.cves.includes(c.id));
  const related = CVES.filter((x) => x.id !== c.id && x.product === c.product).concat(CVES.filter((x) => x.id !== c.id && x.cwe === c.cwe && x.product !== c.product)).slice(0, 4);
  app.innerHTML = `<div class="page">
    <div class="crumb"><a href="#threats">Threats</a> / <span class="mono">${c.id}</span></div>
    <div class="t-head">
      <div class="idline"><span class="sevpill"><i class="s-${s}"></i><span class="c-${s}">${sevName[s]} ${c.cvss.toFixed(1)}</span></span><span>${c.id}</span><span>${c.cwe}</span></div>
      <h1>${esc(c.product)}: ${esc(c.title)}</h1>
    </div>
    <div class="panel status">
      ${c.kev ? `<span class="on"><b>Exploited</b> in the wild</span>` : `<span>Not known to be exploited</span>`}
      ${c.kev ? `<span>KEV due <b class="num">${fmt(due)}</b></span>` : ""}
      ${c.poc ? `<span><b>Public exploit</b> available</span>` : `<span>No public exploit</span>`}
      <span>EPSS <b class="num">${(c.epss * 100).toFixed(1)}%</b> percentile</span>
      ${c.patch === false ? `<span class="on"><b>No patch</b> yet</span>` : `<span class="ok"><b>Fix available</b></span>`}
      <span class="asof">Data as of ${fmt(NOW)} 14:00 UTC</span>
    </div>
    <div class="t-grid">
      <div class="t-main">
        <div class="panel metrics">
          <div class="metric"><span class="lbl">CVSS 3.1</span><span class="val c-${s}">${c.cvss.toFixed(1)}</span><span class="note">NVD, ${sevName[s].toLowerCase()}</span></div>
          <div class="metric"><span class="lbl">EPSS</span><span class="val">${(c.epss * 100 - 3).toFixed(1)}%</span><span class="note">percentile p${Math.round(c.epss * 100)}</span></div>
          <div class="metric"><span class="lbl">KEV due date</span><span class="val">${c.kev ? fmt(due).slice(5) : "None"}</span><span class="note">${c.kev ? "US federal agencies" : "Not in KEV"}</span></div>
          <div class="metric"><span class="lbl">Patch</span><span class="val ${c.patch === false ? "c-crit" : "c-low"}">${c.patch === false ? "None" : "Yes"}</span><span class="note">${c.patch === false ? "No fixed version yet" : "Fixed releases out"}</span></div>
        </div>

        <section class="blk"><h2>Exploitation evidence</h2>
          <ol class="ladder">${ladder.map((l) => `<li class="${l.done ? "done" : ""}${l.soft ? " soft" : ""}"><span class="st">${l.st}</span><span class="ev">${l.ev}</span></li>`).join("")}</ol>
        </section>

        <section class="blk"><h2>What to do</h2>
          ${c.kev ? `<div class="action"><b>Apply the vendor's fixed release, or take the appliance offline until you can.</b><span class="who2">CISA required action. Federal agencies must comply by ${fmt(due)}.</span></div>` : ""}
          <div class="tbl-wrap"><table class="vers"><thead><tr><th>Product</th><th>Affected versions</th><th>Fixed in</th><th>Source</th></tr></thead><tbody>
            ${vers.map((v) => `<tr><td>${esc(v[0])}</td><td class="mono" style="font-size:12.5px">${esc(v[1])}</td><td class="mono" style="font-size:12.5px">${/No fix/.test(v[2]) ? `<span class="c-crit">${esc(v[2])}</span>` : esc(v[2])}</td><td class="muted">${v[3]}</td></tr>`).join("")}
          </tbody></table></div>
        </section>

        <section class="blk"><h2>Timeline</h2>
          <ol class="tl">${ev.map((e) => `<li class="${e.key ? "key" : ""}"><span class="d">${fmt(e.d)}</span><span class="off">${off(e.d)}</span><span><span class="e">${esc(e.e)}</span> <span class="src">· ${esc(e.src)}</span></span></li>`).join("")}</ol>
        </section>

        <section class="blk"><h2>Description</h2>
          <div class="prose"><p>${esc(c.title)} in ${esc(c.product)}. A remote, unauthenticated attacker can send crafted requests to the exposed web interface to bypass authentication checks and reach functionality that should require a valid session. Combined with ${c.id === "CVE-2026-109619" ? "CVE-2026-109618" : "a second flaw"}, this allows arbitrary command execution on the appliance with root privileges.</p>
          <p class="muted" style="font-size:12.5px">Source: NVD description, verbatim.</p></div>
        </section>

        <section class="blk"><h2>CVSS vector</h2>
          <p class="mono muted" style="margin:0;font-size:12.5px;overflow-wrap:anywhere">CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H</p>
          <div class="cvss-v"><div><span>Attack vector</span><b>Network</b></div><div><span>Complexity</span><b>Low</b></div><div><span>Privileges needed</span><b>None</b></div><div><span>User interaction</span><b>None</b></div><div><span>Confidentiality</span><b class="c-crit">High</b></div><div><span>Integrity</span><b class="c-crit">High</b></div><div><span>Availability</span><b class="c-crit">High</b></div><div><span>Scope</span><b>Unchanged</b></div></div>
        </section>

        <section class="blk"><h2>Weakness</h2>
          <div class="prose"><p><b class="mono">${c.cwe}</b> · ${c.cwe === "CWE-287" ? "Improper Authentication" : c.cwe === "CWE-77" ? "Improper Neutralization of Special Elements used in a Command" : "MITRE CWE entry"}. When an actor claims an identity, the product does not prove, or does not sufficiently prove, that the claim is correct.</p>
          <p class="muted" style="font-size:12.5px">From the MITRE CWE catalog, with the matching OWASP cheat sheet linked.</p></div>
        </section>

        <section class="blk"><h2>References</h2>
          <ul class="reflist">
            <li><span class="k">Vendor</span><a href="#cve-${c.id.toLowerCase()}">Security advisory for ${esc(c.product)}</a></li>
            <li><span class="k">NVD</span><a href="#cve-${c.id.toLowerCase()}">nvd.nist.gov/vuln/detail/${c.id}</a></li>
            ${c.kev ? `<li><span class="k">CISA</span><a href="#cve-${c.id.toLowerCase()}">Known Exploited Vulnerabilities catalog entry</a></li>` : ""}
            ${c.poc ? `<li><span class="k">Exploit</span><a href="#cve-${c.id.toLowerCase()}">Exploit-DB entry and 2 GitHub proof-of-concept repos</a></li>` : ""}
            <li><span class="k">OSV</span><a href="#cve-${c.id.toLowerCase()}">osv.dev record</a></li>
          </ul>
        </section>
      </div>
      <aside class="t-aside">
        <div class="panel aside-box"><h3>In the news</h3>${stories.length ? stories.map((x) => `<div class="story"><a href="#threats">${esc(x.title)}</a><span>${esc(x.src)} · ${relD(x.age)}</span></div>`).join("") : `<p class="muted" style="margin:0;font-size:13px">No coverage yet.</p>`}</div>
        <div class="panel aside-box"><h3>Related threats</h3>${related.length ? related.map((x) => `<div class="story"><a class="mono" href="#cve-${x.id.toLowerCase()}">${x.id}</a><span>${esc(x.product)} · ${x.kev ? "exploited" : "EPSS p" + Math.round(x.epss * 100)}</span></div>`).join("") : `<p class="muted" style="margin:0;font-size:13px">None found.</p>`}</div>
        <div class="panel aside-box"><h3>Where it's seen</h3><dl class="kv"><dt>United States</dt><dd>41</dd><dt>Germany</dt><dd>12</dd><dt>Japan</dt><dd>7</dd></dl><span class="muted" style="font-size:12px">Scanning and exploit attempts that name this CVE, last ${rangeLabel()}.</span></div>
      </aside>
    </div>
  </div>`;
}

// ---- Drawer (quick view from a lane) ----
function openDrawer(id) {
  const c = CVES.find((x) => x.id === id); if (!c) return;
  const s = sev(c.cvss);
  const root = document.getElementById("drawer-root");
  root.innerHTML = `<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dh">
    <div class="drawer-head"><div style="display:grid;gap:4px;min-width:0"><span class="mono muted" style="font-size:12.5px">${c.id}</span><h2 id="dh" style="font-size:19px">${esc(c.product)}</h2></div><button type="button" class="x" id="dx" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
    <div class="drawer-body">
      <div style="display:flex;flex-wrap:wrap;gap:4px"><span class="sevpill"><i class="s-${s}"></i><span class="c-${s}">${c.cvss.toFixed(1)} ${sevName[s]}</span></span>&nbsp;${c.kev ? `<span class="tag kev">KEV ${relD(c.kevAge)}</span>` : ""}${c.poc ? `<span class="tag poc">PoC</span>` : ""}<span class="tag">EPSS p${Math.round(c.epss * 100)}</span></div>
      <div class="prose"><p><b>${esc(c.title)}.</b> A remote, unauthenticated attacker can send crafted requests to the exposed web interface of ${esc(c.product)} to bypass authentication checks and reach functionality that should require a valid session, including configuration export and the admin REST endpoints at /api/v1/configuration/users/user-roles/user-role/rest-userrole1/web/web-bookmarks/bookmark. Long summaries and long URLs wrap inside the drawer instead of running off screen.</p></div>
      <dl class="kv"><dt>Published</dt><dd>${fmt(ago(c.pubAge))}</dd>${c.kev ? `<dt>Added to KEV</dt><dd>${fmt(ago(c.kevAge))}</dd>` : ""}<dt>Weakness</dt><dd>${c.cwe}</dd><dt>Patch</dt><dd>${c.patch === false ? "none" : "available"}</dd></dl>
      <a class="btn" href="#cve-${c.id.toLowerCase()}">Open threat page →</a>
    </div></aside>`;
  const close = () => closeDrawer();
  document.getElementById("scrim").addEventListener("click", close);
  document.getElementById("dx").addEventListener("click", close);
  document.getElementById("dx").focus();
}
function closeDrawer() { document.getElementById("drawer-root").innerHTML = ""; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

route();
</script>
