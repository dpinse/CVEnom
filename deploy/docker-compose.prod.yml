# Production stack. Run from the repo root:
#   docker compose --env-file ./.env -f deploy/docker-compose.prod.yml up -d
# The project directory is deploy/, so --env-file is required for the root .env to be
# used for `${VAR:?}` interpolation (which aborts if a value is unset).
# Secrets come from ../.env (copy .env.example). The app containers receive the whole
# file via env_file, so the infrastructure passwords are blanked in `environment`
# below: the app only needs them inside DATABASE_URL / REDIS_URL.
x-app: &app
  build:
    context: ../backend
  image: cvenom-backend:latest
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+psycopg://cvenom_app:${APP_DB_PASSWORD:?}@postgres:5432/cvenom
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    GEOIP_DIR: /data/geoip
    REQUIRE_SECRETS_KEY: "true"
    POSTGRES_PASSWORD: ""
    APP_DB_PASSWORD: ""
    REDIS_PASSWORD: ""
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - "no-new-privileges:true"
  user: "10001:10001"
  networks:
    - cvenom

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://cvenom_app:${APP_DB_PASSWORD:?}@postgres:5432/cvenom
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      GEOIP_DIR: /data/geoip
      REQUIRE_SECRETS_KEY: "true"
      # Merge keys are shallow: this block replaces x-app's environment, so repeat the blanks.
      POSTGRES_PASSWORD: ""
      APP_DB_PASSWORD: ""
      REDIS_PASSWORD: ""
      # Trusted hops, right to left: nginx (172.28.0.10, the TCP peer) then the bridge gateway
      # 172.28.0.1 (what nginx sees when cloudflared on the host connects to 127.0.0.1:8080).
      # No ports are published: the api is reachable only through nginx.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.1,172.28.0.10}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: ["worker"]
    restart: unless-stopped
    volumes:
      - geoip:/data/geoip
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # The image's HEALTHCHECK probes the api's HTTP port, which the worker does not serve.
    healthcheck:
      test: ["CMD-SHELL", "celery -A cvenom.tasks:celery_app inspect ping -d celery@$$HOSTNAME -t 5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  beat:
    <<: *app
    command: ["beat"]
    restart: unless-stopped
    # Beat serves no HTTP and answers no remote control; the image's api HEALTHCHECK would
    # mark it unhealthy forever. It is supervised by restart: unless-stopped instead.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    networks:
      - cvenom
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cvenom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d cvenom"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - cvenom
    # volatile-ttl evicts only keys with a TTL, shortest first: 30 s cache entries
    # go before rate-limit counters (60 s / 900 s). Celery broker messages carry
    # no TTL and are never evicted.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ../frontend
    image: cvenom-frontend:latest
    restart: unless-stopped
    # Unprivileged nginx (uid 101): static SPA, strict CSP, same-origin proxy for /api and the
    # WebSocket. The only published port; loopback only, for cloudflared / a host proxy.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      cvenom:
        ipv4_address: 172.28.0.10
    depends_on:
      api:
        condition: service_started
    read_only: true
    # nginx-unprivileged writes its pid to /tmp and its temp/cache files under /var/cache/nginx
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  cvenom:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  pgdata:
  redisdata:
  geoip:
